<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Google Antigravity | Personal Link Hub</title>
  
  <!-- Matter.js Physics Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0b10;
      --card-bg: rgba(23, 25, 38, 0.72);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-border-hover: rgba(255, 255, 255, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-glow: rgba(99, 102, 241, 0.3);
      --neon-cyan: #06b6d4;
      --neon-purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      touch-action: none;
    }

    /* Ambient Background Glow */
    .cosmic-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background: 
        radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.1) 0%, transparent 60%),
        #090a0f;
      overflow: hidden;
    }

    /* Grid overlay for tech look */
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Canvas overlay */
    #physics-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: grab;
      touch-action: none;
    }

    #physics-canvas:active {
      cursor: grabbing;
    }

    /* DOM Layer for floating elements */
    #dom-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
      pointer-events: none;
    }

    /* Fixed UI Header (Avatar, Bio, Gravity Control) */
    .header-container {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 90%;
      max-width: 480px;
      pointer-events: auto;
      text-align: center;
    }

    .profile-card {
      background: rgba(17, 20, 32, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 28px;
      padding: 22px 28px;
      width: 100%;
      box-shadow: 
        0 20px 40px -15px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
    }

    .profile-card:hover {
      border-color: rgba(255, 255, 255, 0.2);
      box-shadow: 
        0 25px 50px -15px rgba(0, 0, 0, 0.8),
        inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .avatar-wrapper {
      position: relative;
      width: 86px;
      height: 86px;
      margin: 0 auto 14px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #06b6d4, #8b5cf6, #ec4899);
      box-shadow: 0 0 25px rgba(139, 92, 246, 0.4);
      animation: avatarPulse 4s ease-in-out infinite alternate;
    }

    @keyframes avatarPulse {
      0% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.4); }
      100% { box-shadow: 0 0 35px rgba(236, 72, 153, 0.5); }
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      background: #111422;
      border: 2px solid #090a0f;
    }

    .online-indicator {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 15px;
      height: 15px;
      background: #10b981;
      border: 2.5px solid #090a0f;
      border-radius: 50%;
      box-shadow: 0 0 10px #10b981;
    }

    .profile-name {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .verified-badge {
      display: inline-flex;
      color: #38bdf8;
      font-size: 1.1rem;
    }

    .profile-bio {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.45;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .profile-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .mode-toggle-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(23, 27, 44, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-toggle-btn:hover {
      background: rgba(35, 41, 68, 0.95);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
    }

    .mode-toggle-btn:active {
      transform: translateY(0);
    }

    .mode-indicator-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #06b6d4;
      box-shadow: 0 0 10px #06b6d4;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .mode-toggle-btn.normal-mode .mode-indicator-dot {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    .mode-toggle-btn.antigravity-mode .mode-indicator-dot {
      background: #ec4899;
      box-shadow: 0 0 12px #ec4899;
      animation: pulseNeon 1.5s infinite;
    }

    @keyframes pulseNeon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(23, 27, 44, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .action-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      transform: scale(1.08);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    /* Floating Link Cards (Rigid Bodies in DOM) */
    .link-card {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      box-shadow: 
        0 14px 28px -6px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transform-origin: center center;
      will-change: transform;
      pointer-events: none; /* Pointer handled by physics canvas */
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .link-card.active-drag {
      border-color: rgba(255, 255, 255, 0.45);
      box-shadow: 
        0 20px 40px -5px rgba(0, 0, 0, 0.7),
        0 0 25px var(--accent-glow);
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: #fff;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    }

    .icon-box svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .link-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      white-space: nowrap;
    }

    .link-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .link-desc {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .external-arrow {
      margin-left: auto;
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.85rem;
      transition: transform 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
    }

    /* Hints at bottom */
    .hint-container {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 17, 26, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      padding: 8px 18px;
      font-size: 0.76rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
      animation: fadeInOut 3s infinite alternate;
    }

    @keyframes fadeInOut {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    .hint-key {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 2px 6px;
      color: #e2e8f0;
      font-weight: 600;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      .header-container {
        top: 16px;
        width: 92%;
      }
      .profile-card {
        padding: 18px 20px;
        border-radius: 24px;
      }
      .avatar-wrapper {
        width: 74px;
        height: 74px;
        margin-bottom: 10px;
      }
      .profile-name {
        font-size: 1.2rem;
      }
      .profile-bio {
        font-size: 0.8rem;
      }
      .hint-container {
        bottom: 12px;
        padding: 6px 14px;
        font-size: 0.7rem;
      }
    }
  </style>
</head>

      const resetBtn = document.getElementById('reset-btn');

      // Card o'lchamlari
      function getCardDimensions() {
        const isMobile = window.innerWidth < 640;
        return {
          width: isMobile ? 240 : 270,
          height: isMobile ? 66 : 72
        };
      }

      // 1. Dastlabki sozlash
      function initPhysics() {
        // Matter Engine
        engine = Engine.create({
          enableSleeping: false
        });
        world = engine.world;

        // Gravitatsiyani boshlang'ich sozlash (Antigravitatsiya rejimi: yengil float yoki nol)
        setGravityMode(true);

        // Runner
        runner = Runner.create();
        Runner.run(runner, engine);

        // Canvas va Render
        render = Render.create({
          canvas: canvas,
          engine: engine,
          options: {
            width: window.innerWidth,
            height: window.innerHeight,
            wireframes: false,
            background: 'transparent'
          }
        });
        Render.run(render);

        // Devorlar yaratish
        createWalls();

        // Bloklarni yaratish
        createLinkBlocks();

        // Mouse Constraint (Sichqoncha & Touch boshqaruvi)
        setupInteractions();

        // Har bir frame yangilanishida DOM elementlarini sinxronlash
        Events.on(engine, 'afterUpdate', updateDOMTransformations);
      }

      // 2. Chegara devorlarini yaratish (Screen boundaries)
      function createWalls() {
        // Eski devorlarni tozalash
        if (walls.length > 0) {
          Composite.remove(world, walls);
          walls = [];
        }

        const width = window.innerWidth;
        const height = window.innerHeight;
        const thickness = 120; // Qalin devorlar bloklar teshib o'tmasligi uchun

        const wallOptions = {
          isStatic: true,
          restitution: 0.8, // Qaytish elastikligi
          friction: 0.1,
          render: { visible: false } // Ko'rinmas devorlar
        };

        // Devorlar
        const floor = Bodies.rectangle(width / 2, height + thickness / 2, width * 2, thickness, wallOptions);
        const ceiling = Bodies.rectangle(width / 2, -thickness / 2, width * 2, thickness, wallOptions);
        const leftWall = Bodies.rectangle(-thickness / 2, height / 2, thickness, height * 2, wallOptions);
        const rightWall = Bodies.rectangle(width + thickness / 2, height / 2, thickness, height * 2, wallOptions);

        walls = [floor, ceiling, leftWall, rightWall];
        Composite.add(world, walls);
      }

      // 3. Havola bloklarini yaratish (Rigid Bodies + DOM Nodes)
      function createLinkBlocks() {
        // Tozalash
        linkBodies.forEach(item => {
          Composite.remove(world, item.body);
          if (item.domElement && item.domElement.parentNode) {
            item.domElement.parentNode.removeChild(item.domElement);
          }
        });
        linkBodies = [];

        const { width: cardW, height: cardH } = getCardDimensions();
        const headerRect = document.getElementById('main-header').getBoundingClientRect();
        const startY = headerRect.bottom + 40;
        const screenW = window.innerWidth;
        const screenH = window.innerHeight;

        LINKS_DATA.forEach((link, idx) => {
          // Boshlang'ich tarqoq koordinatalar
          const cols = screenW < 768 ? 1 : (screenW < 1100 ? 2 : 3);
          const colIdx = idx % cols;
          const rowIdx = Math.floor(idx / cols);

          const cellW = screenW / cols;
          const initialX = (colIdx * cellW) + (cellW / 2) + (Math.random() * 40 - 20);
          const initialY = startY + (rowIdx * (cardH + 28)) + (Math.random() * 30 - 15);

          // Chegaralardan chiqmasligini tekshirish
          const clampedX = Math.max(cardW / 2 + 20, Math.min(screenW - cardW / 2 - 20, initialX));
          const clampedY = Math.max(cardH / 2 + 20, Math.min(screenH - cardH / 2 - 30, initialY));

          // Fizik tana (Rounded chamfer Body)
          const body = Bodies.rectangle(clampedX, clampedY, cardW, cardH, {
            chamfer: { radius: 18 },
            restitution: 0.75, // Elastik sakrash
            friction: 0.05,
            frictionAir: 0.015, // Past havo qarshiligi (erkin suzish)
            density: 0.0015,
            render: { visible: false } // Canvasda emas, DOM orqali chizamiz
          });

          // Meta ma'lumot
          body.plugin = {
            linkUrl: link.url,
            id: link.id
          };

          // DOM elementi yaratish
          const domElement = document.createElement('div');
          domElement.className = 'link-card';
          domElement.style.width = `${cardW}px`;
          domElement.style.height = `${cardH}px`;
          domElement.innerHTML = `
            <div class="icon-box" style="background: ${link.color}">
              ${link.iconSvg}
            </div>
            <div class="link-info">
              <div class="link-title">
                ${link.title}
              </div>
              <div class="link-desc">${link.desc}</div>
            </div>
            <div class="external-arrow">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M7 17L17 7M17 7H7M17 7V17"/>
              </svg>
            </div>
          `;

          domLayer.appendChild(domElement);

          // Boshlang'ich mikroturtki (Zero-G effekti uchun)
          Body.setVelocity(body, {
            x: (Math.random() - 0.5) * 2.5,
            y: (Math.random() - 0.5) * 2.5
          });
          Body.setAngularVelocity(body, (Math.random() - 0.5) * 0.04);

          Composite.add(world, body);

          linkBodies.push({
            body: body,
            domElement: domElement,
            link: link,
            width: cardW,
            height: cardH
          });
        });
      }

      // 4. DOM Transform sinxronizatsiyasi
      function updateDOMTransformations() {
        linkBodies.forEach(item => {
          const { x, y } = item.body.position;
          const angle = item.body.angle;

          // Markazdan transform qilish
          const translateX = x - item.width / 2;
          const translateY = y - item.height / 2;

          item.domElement.style.transform = `translate3d(${translateX}px, ${translateY}px, 0px) rotate(${angle}rad)`;
        });

        // Agar antigravitatsiya rejimida bo'lsa, elementlar to'xtab qolmasligi uchun yengil tebranish kuchi
        if (isAntigravity) {
          linkBodies.forEach(item => {
            const speed = Vector.magnitude(item.body.velocity);
            if (speed < 0.3) {
              Body.applyForce(item.body, item.body.position, {
                x: (Math.random() - 0.5) * 0.0003,
                y: (Math.random() - 0.5) * 0.0003
              });
            }
          });
        }
      }

      // 5. Sichqoncha va Drag / Click farqlash mantiqi
      function setupInteractions() {
        const mouse = Mouse.create(canvas);

        const mouseConstraint = MouseConstraint.create(engine, {
          mouse: mouse,
          constraint: {
            stiffness: 0.25,
            damping: 0.1,
            render: { visible: false }
          }
        });

        Composite.add(world, mouseConstraint);

        // Click vs Drag mantiqi
        let pointerStartPos = null;
        let pointerStartTime = 0;
        let targetBody = null;
        let activeDomItem = null;

        // Pointer down
        Events.on(mouseConstraint, 'mousedown', function (event) {
          pointerStartPos = { x: mouse.position.x, y: mouse.position.y };
          pointerStartTime = Date.now();

          // Qaysi havola ustida bosilganini aniqlash
          const bodiesUnderMouse = Query.point(linkBodies.map(l => l.body), mouse.position);
          if (bodiesUnderMouse.length > 0) {
            targetBody = bodiesUnderMouse[0];
            activeDomItem = linkBodies.find(l => l.body === targetBody);
            if (activeDomItem) {
              activeDomItem.domElement.classList.add('active-drag');
            }
          } else {
            targetBody = null;
            activeDomItem = null;
          }
        });

        // Pointer up
        Events.on(mouseConstraint, 'mouseup', function (event) {
          if (activeDomItem) {
            activeDomItem.domElement.classList.remove('active-drag');
          }

          if (targetBody && pointerStartPos) {
            const dx = mouse.position.x - pointerStartPos.x;
            const dy = mouse.position.y - pointerStartPos.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const duration = Date.now() - pointerStartTime;

            // Agar 10 pikseldan kam siljigan bo'lsa va 380ms ichida bo'lsa — bu KLIK!
            if (distance < 10 && duration < 380) {
              const url = targetBody.plugin?.linkUrl;
              if (url) {
                // Yangi oynada ochish
                window.open(url, '_blank', 'noopener,noreferrer');
              }
            }
          }

          targetBody = null;
          activeDomItem = null;
          pointerStartPos = null;
        });
      }

      // 6. Gravitatsiya rejimini boshqarish
      function setGravityMode(antigravityActive) {
        isAntigravity = antigravityActive;

        if (isAntigravity) {
          // Antigravitatsiya: deyarli vaznsizlik, juda yengil ko'tarilish yoki erkin suzish
          engine.gravity.y = -0.015;
          engine.gravity.x = 0;
          engine.gravity.scale = 0.001;

          gravityBtn.classList.add('antigravity-mode');
          gravityBtn.classList.remove('normal-mode');
          gravityBtnText.textContent = 'Antigravitatsiya: YOQILGAN';

          // Bloklarga yengil tasodifiy turtki berish
          linkBodies.forEach(item => {
            Body.setVelocity(item.body, {
              x: (Math.random() - 0.5) * 3,
              y: (Math.random() - 0.5) * 3
            });
          });
        } else {
          // Normal rejim: Yer gravitatsiyasi (pastga tushadi va elastik sakraydi)
          engine.gravity.y = 1;
          engine.gravity.x = 0;
          engine.gravity.scale = 0.001;

          gravityBtn.classList.remove('antigravity-mode');
          gravityBtn.classList.add('normal-mode');
          gravityBtnText.textContent = 'Normal Rejim: Gravitatsiya (1G)';
        }
      }

      // Tugmalar hodisalari
      gravityBtn.addEventListener('click', () => {
        setGravityMode(!isAntigravity);
      });

      // Scatter (Sochib yuborish)
      scatterBtn.addEventListener('click', () => {
        linkBodies.forEach(item => {
          const forceMagnitude = 0.045 * item.body.mass;
          const angle = Math.random() * Math.PI * 2;
          Body.applyForce(item.body, item.body.position, {
            x: Math.cos(angle) * forceMagnitude,
            y: Math.sin(angle) * forceMagnitude
          });
          Body.setAngularVelocity(item.body, (Math.random() - 0.5) * 0.1);
        });
      });

      // Reset (Tartibli qaytarish)
      resetBtn.addEventListener('click', () => {
        createLinkBlocks();
      });

      // 7. Window Resize hodisasi
      let resizeTimeout;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
          const width = window.innerWidth;
          const height = window.innerHeight;

          // Render va canvas hajmini yangilash
          render.canvas.width = width;
          render.canvas.height = height;

          // Devorlarni yangilash
          createWalls();

          // Agar biron blok ekrandan chiqib ketgan bo'lsa, ichkariga tortish
          const { width: cardW, height: cardH } = getCardDimensions();
          linkBodies.forEach(item => {
            let px = item.body.position.x;
            let py = item.body.position.y;

            if (px < cardW / 2) px = cardW / 2 + 10;
            if (px > width - cardW / 2) px = width - cardW / 2 - 10;
            if (py < cardH / 2) py = cardH / 2 + 10;
            if (py > height - cardH / 2) py = height - cardH / 2 - 10;

            Body.setPosition(item.body, { x: px, y: py });
          });
        }, 150);
      });

      // Boshlash
      initPhysics();
    })();
  </script>
</body>
</html>
